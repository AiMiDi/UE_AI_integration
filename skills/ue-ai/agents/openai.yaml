interface:
  display_name: "UE AI"
  short_description: "Prefer native UE CLIs; use MCP when needed."
  default_prompt: "Use $ue-ai to inspect this Unreal project, prefer ue-cli and ue-workflow-cli with MCP fallback, select the right domain skill, execute safely, and verify the result."

dependencies:
  tools:
    - type: "mcp"
      value: "ue_ai_integration"
      description: "UE_AI_integration local stdio MCP server"
      transport: "stdio"

policy:
  allow_implicit_invocation: true
