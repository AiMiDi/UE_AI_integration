[FilterPlugin]
; Runtime MCP bridge. scripts/build_plugin.bat restores production dependencies
; into the packaged MCP directory after BuildPlugin filtering completes.
/MCP/dist/...
/MCP/package.json
/MCP/package-lock.json

; Keep the TypeScript source and compiler config in source-capable packages.
/MCP/src/...
/MCP/tsconfig.json

; Shared UE Workflow core and versioned contracts are required by both UBT
; source builds and the Editor runtime handshake/planner.
/Workflow/...

; Keep the portable CLI build graph in every source-capable BuildPlugin
; package. Prebuilt CLI binaries are host-platform specific, so Linux and Mac
; users must be able to build ue and ue-workflow from the packaged sources.
/CMakeLists.txt
/.gitattributes
/CLI/...

